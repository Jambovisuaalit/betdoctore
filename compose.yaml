services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: betdoctore
      POSTGRES_USER: betdoctore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betdoctore"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://betdoctore:${POSTGRES_PASSWORD}@db:5432/betdoctore
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://betdoctore:${POSTGRES_PASSWORD}@db:5432/betdoctore
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
