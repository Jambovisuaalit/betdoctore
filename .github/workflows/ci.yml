name: verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: betdoctore
          POSTGRES_USER: betdoctore
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U betdoctore" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://betdoctore:test@localhost:5432/betdoctore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q
      - run: betdoctore fixture-backtest
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-backtest
          path: reports/fixture
      - name: Container build and Compose API smoke
        env:
          POSTGRES_PASSWORD: ci-container-only
        run: |
          docker compose up --build -d --wait
          curl --fail --retry 20 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:8000/ready
      - name: Compose diagnostics
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-container-only
        run: docker compose logs --no-color
      - name: Stop Compose services
        if: always()
        env:
          POSTGRES_PASSWORD: ci-container-only
        run: docker compose down
