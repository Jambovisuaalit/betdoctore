[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "betdoctore"
version = "0.1.0"
description = "Point-in-time NBA totals research platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "typer>=0.12,<1", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2,<3", "scipy>=1.14,<2", "pandas>=2.2,<3", "pyarrow>=17,<24", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
ml = ["catboost>=1.2,<2"]
[project.scripts]
betdoctore = "betdoctore.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
